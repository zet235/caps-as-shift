name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build and test Windows x64
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install MinGW-w64 toolchain
        id: msys2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-binutils

      - name: Build and run C++ tests
        shell: powershell
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $env:Path = "$env:MSYS2_LOCATION\ucrt64\bin;$env:Path"
          & g++ --version
          if ($LASTEXITCODE -ne 0) { throw 'C++ compiler unavailable' }
          & windres --version
          if ($LASTEXITCODE -ne 0) { throw 'Resource compiler unavailable' }
          & .\build.ps1 -SkipGuiSmoke
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }

      - name: Generate SHA-256 checksum
        shell: powershell
        run: |
          $hash = (Get-FileHash -LiteralPath .\CapsAsShift.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText((Join-Path $PWD 'SHA256SUMS.txt'), "$hash  CapsAsShift.exe`n", [System.Text.Encoding]::ASCII)

      - name: Upload Windows executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CapsAsShift-windows-x64
          path: |
            CapsAsShift.exe
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub-built release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download this run's executable
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: CapsAsShift-windows-x64

      - name: Verify checksum
        run: sha256sum --check SHA256SUMS.txt

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh release create "$RELEASE_TAG" CapsAsShift.exe SHA256SUMS.txt \
            --verify-tag \
            --title "CapsAsShift $RELEASE_TAG" \
            --notes "Windows x64 executable built and tested on GitHub Actions. Build log: $BUILD_URL. The SHA256SUMS.txt asset contains its checksum. Interactive tray and physical IME tests require a Windows desktop and are not run by this workflow." \
            --generate-notes
